<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Registration Form</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, sans-serif;
      background: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .form-container {
      background: white;
      padding: 40px;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 450px;
    }
    h2 { margin-bottom: 25px; color: #333; text-align: center; }
    label { display: block; margin-bottom: 5px; color: #555; font-size: 14px; }
    input, select {
      width: 100%;
      padding: 10px 15px;
      margin-bottom: 20px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 15px;
    }
    input:focus, select:focus {
      outline: none;
      border-color: #4f8ef7;
    }
    button {
      width: 100%;
      padding: 12px;
      background: #4f8ef7;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover { background: #3a7be0; }
    .success {
      display: none;
      text-align: center;
      color: green;
      margin-top: 15px;
      font-size: 15px;
    }
  </style>
</head>
<body>
  <div class="form-container">
    <h2>Registration Form</h2>

    <label>Name</label>
    <input type="text" id="name" placeholder="Enter your Name" />

    <label>Email</label>
    <input type="email" id="email" placeholder="Enter your email" />

    <label>Field of Interest</label>
    <select id="interest">
      <option value="">-- Select --</option>
      <option value="Web Development">Web Development</option>
      <option value="Data Science">Data Science</option>
      <option value="DevOps">DevOps</option>
      <option value="AI">AI</option>
      <option value="Cybersecurity">Cybersecurity</option>
    </select>

    <button onclick="submitForm()">Submit</button>
    <p class="success" id="successMsg">✅ Form submitted successfully!</p>
  </div>

  <script>
    const API = 'http://54.172.235.182:5000';

    async function submitForm() {
      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const interest = document.getElementById('interest').value;

      if (!name || !email || !interest) {
        alert('Please fill all fields!');
        return;
      }

      const res = await fetch(`${API}/register`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, email, interest })
      });

      if (res.ok) {
        document.getElementById('successMsg').style.display = 'block';
      }
    }
  </script>
</body>
</html>
